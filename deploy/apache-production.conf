# Production Apache Configuration for DBT Web
# Apply to Apache virtual host or /etc/apache2/conf-available/dbt-production.conf

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes -MultiViews
    AllowOverride All
    Require all granted
</Directory>

# Protect sensitive locations outside of webroot or at root level
<DirectoryMatch "^/var/www/html/(?:\.scratch|scratch|database|includes|tests|tools|deploy|docs|dist|\.agents|\.git)">
    Require all denied
</DirectoryMatch>

# Prohibit execution of uploaded scripts
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    <FilesMatch "(?i)\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh|bash|exe|jsp|asp|aspx|shtml|svgz|pht)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
